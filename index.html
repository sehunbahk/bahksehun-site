<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BahkSeHun — Director of Photography / Photographer</title>
<meta name="description" content="박세훈 BahkSeHun — Director of Photography / Photographer. Film, Commercial, Photography.">
<meta name="author" content="BahkSeHun">
<meta name="theme-color" content="#000000">
<!-- 링크 공유 미리보기 (카카오톡·인스타그램·페이스북 등) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="BahkSeHun">
<meta property="og:title" content="BahkSeHun — Director of Photography / Photographer">
<meta property="og:description" content="Film, Commercial, Photography">
<meta property="og:image" content="https://bahksehun.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://bahksehun.com/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://bahksehun.com/">
<!-- 탭 아이콘 -->
<link rel="icon" type="image/png" sizes="32x32" X
<link rel="apple-touch-icon" sizes="180x180" X
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#f2f1ee;--muted:#8a8f94;--line:#2c3034;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:300 16px/1.7 "Jost","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:4px}
header{text-align:center;padding:40px 24px 0}
.brand{font-size:26px;font-weight:400;letter-spacing:.1em;display:inline-block}
.info{display:block;font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:2px}
nav.main{display:flex;justify-content:center;gap:clamp(22px,7vw,90px);margin-top:26px;font-size:18px}
nav a{padding-bottom:4px;border-bottom:1px solid transparent;color:var(--muted);transition:color .2s}
nav a:hover,nav a.on{color:var(--text)}
nav a.on{border-color:var(--text)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.sub{display:flex;justify-content:center;gap:clamp(40px,8vw,96px);margin:44px auto 22px;font-size:17px}
main{padding:36px 0 80px}
.sub+div{margin-top:0}
.hero img,.hero video{display:block;width:100%;aspect-ratio:1.9/1;object-fit:cover;background:#000}
.bar{display:grid;place-items:center;aspect-ratio:3.4/1;margin-bottom:22px;background:var(--bg-img,#111) center/cover;position:relative;text-align:center}
.bar:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .3s}
.bar:hover:before,.bar:focus-visible:before{background:rgba(0,0,0,.45)}
.bar span{position:relative;font-size:clamp(18px,2.7vw,28px);letter-spacing:.06em;opacity:0;transition:opacity .3s}
.bar:hover span,.bar:focus-visible span{opacity:1}
@media (hover:none){.bar:before{background:rgba(0,0,0,.35)}.bar span{opacity:1}}
.bar small{display:block;font-size:13px;color:#c9ccce;letter-spacing:.1em}
.stage{position:relative;aspect-ratio:16/9;background:#000 center/cover}
.stage button{position:absolute;top:0;bottom:0;width:72px;border:0;background:none;color:var(--text);font-size:30px;cursor:pointer;opacity:.7}
.stage button:hover{opacity:1}
.stage .prev{left:0}.stage .next{right:0}
.count{position:absolute;right:16px;bottom:10px;font-size:13px;color:#c9ccce}
dl.cred{display:grid;grid-template-columns:auto auto;gap:6px 24px;justify-content:end;margin:30px 0 0;font-size:17px;text-align:right}
dl.cred dt,dl.cred dd{text-align:right}
dt{color:var(--muted)}dd{margin:0}
.fest{text-align:right;margin-top:26px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.photos .tile{display:grid;place-items:center;aspect-ratio:3/4;background:#111 center/cover no-repeat;position:relative;text-align:center}
.photos .tile:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .3s}
.photos .tile:hover:before,.photos .tile:focus-visible:before{background:rgba(0,0,0,.45)}
.photos .tile span{position:relative;font-size:clamp(16px,1.9vw,22px);letter-spacing:.06em;opacity:0;transition:opacity .3s;padding:0 12px}
.photos .tile:hover span,.photos .tile:focus-visible span{opacity:1}
@media (hover:none){.photos .tile:before{background:rgba(0,0,0,.35)}.photos .tile span{opacity:1}}
.text{max-width:56ch;margin:0 auto;text-align:center}
.info-page{padding-top:clamp(24px,6vw,64px)}
.info-page .portrait{display:block;width:clamp(180px,24vw,260px);aspect-ratio:4/5;object-fit:cover;margin:0 auto 40px;background:#111}
.info-page .role{font-size:clamp(17px,2vw,20px);letter-spacing:.06em;margin:0 0 40px}
.info-page .contact{font-size:16px;line-height:2;color:var(--muted);margin:0}
.info-page .contact a{transition:color .2s}
.info-page .contact a:hover{color:var(--text)}
.text a.big{font-size:clamp(22px,4vw,40px);border-bottom:1px solid var(--text)}
#view{transition:opacity .5s ease}
.player{position:relative;aspect-ratio:16/9;width:100%;background:#000 center/contain no-repeat;margin:0 auto}
.player .pbtn{position:absolute;inset:0;border:0;background:rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}
.player .pbtn:hover{background:rgba(0,0,0,.1)}
.player .pbtn i{width:72px;height:72px;border-radius:50%;border:2px solid var(--text);display:grid;place-items:center}
.player .pbtn i:after{content:"";margin-left:6px;border-left:18px solid var(--text);border-top:11px solid transparent;border-bottom:11px solid transparent}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{text-align:right;font-size:13px;color:var(--muted);margin:10px 0 34px}
.ytlink a{border-bottom:1px solid var(--line)}
.stage .l{position:absolute;inset:0;background:center/cover;transition:opacity .7s ease}
.stage button,.count{z-index:2}
.ps{padding-top:8px}
.ps-title{font-weight:300;font-size:clamp(18px,2.7vw,28px);letter-spacing:.06em;text-align:center;margin:0 0 clamp(36px,6vw,72px)}
.ps-row{display:flex;gap:clamp(12px,2vw,22px);margin:0 auto clamp(36px,7vw,96px)}
.ps-row figure{margin:0;flex:1;min-width:0}
.ps-row img{display:block;width:100%;height:auto;background:#111}
.ps-row.inset-r{width:80%;margin-right:0}
.ps-row.inset-l{width:80%;margin-left:0}
.ps-row.narrow{width:62%}
@media (max-width:720px){.ps-row.pair{flex-direction:column}.ps-row.inset-r,.ps-row.inset-l{width:100%}.ps-row.narrow{width:86%}.bar{aspect-ratio:2/1}.photos{grid-template-columns:repeat(2,1fr)}.stage button{width:48px}nav.main{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">BahkSeHun</a>
  <a class="info" href="#/info">info</a>
  <nav class="main" aria-label="메인">
    <a href="#/film" data-n="cine">Cinematography</a>
    <a href="#/photo" data-n="photo">Photography</a>
  </nav>
</header>
<div class="wrap" id="sub" hidden>
  <div class="sub"><a href="#/film" data-s="film">Film</a><a href="#/commercial" data-s="commercial">Commercial</a></div>
</div>
<main><div class="wrap" id="view"></div></main>

<script src="content.js"></script>
<script>
/* 내용은 content.js에서 고칩니다. 이 아래는 사이트 동작 코드입니다. */
const HERO="images/poster.jpg";
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pad(n){return n<10?'0'+n:''+n}
function files(w){var a=[];for(var k=1;k<=(w.count||0);k++)a.push('images/'+w.folder+'/'+pad(k)+'.jpg');return a}
function work(w){var f=files(w);return{t:esc(w.title),y:esc(w.year),dir:esc(w.director),dop:esc(w.dp||'Bahk Se Hun'),
  note:(w.note||[]).map(esc).join('<br>'),ar:w.ratio||'16/9',fit:w.fit,yt:w.youtube||'',pos:w.coverPosition,
  th:'url(images/'+w.folder+'/'+(w.cover||'01.jpg')+')',stills:f.map(function(b){return'url('+b+')'})}}
const DATA={film:(typeof FILM!=='undefined'?FILM:[]).map(work),commercial:(typeof COMMERCIAL!=='undefined'?COMMERCIAL:[]).map(work)};
const PHOTO_DATA=(typeof PHOTO!=='undefined'?PHOTO:[]).map(function(p){
  var ph=files(p),W={'오른쪽':'inset-r','right':'inset-r','왼쪽':'inset-l','left':'inset-l','좁게':'narrow','narrow':'narrow'};
  var lay=p.layout&&p.layout.length?p.layout:ph.map(function(_,k){return String(k+1)});
  var rows=lay.map(function(line){var tk=String(line).trim().split(/\s+/),nums=[],w='';
    tk.forEach(function(x){if(W[x])w=W[x];else if(+x>=1&&+x<=ph.length)nums.push(+x-1)});
    if(nums.length===1&&w)return[{i:nums[0],w:w}];return nums}).filter(function(r){return r.length});
  return{t:esc(p.title),th:'images/'+p.folder+'/'+(p.cover||'01.jpg'),tpos:p.coverPosition,photos:ph,rows:rows}});
const INFO=typeof SITE!=='undefined'?SITE:{};
const view=document.getElementById('view'),sub=document.getElementById('sub');
let cur=null;
function render(){
  var p=(location.hash.slice(2)||'').split('/'),a=p[0]||'home',b=p[1];
  var cine=(a==='film'||a==='commercial');
  document.querySelectorAll('nav a').forEach(function(x){x.classList.toggle('on',(x.dataset.n==='cine'&&cine)||x.dataset.n===a)});
  sub.hidden=!cine;
  document.querySelectorAll('[data-s]').forEach(function(x){x.classList.toggle('on',x.dataset.s===a);x.style.borderBottom=x.dataset.s===a?'1px solid var(--text)':'1px solid transparent';x.style.paddingBottom='4px'});
  cur=null;window.scrollTo(0,0);
  if(a==='home'){
    /* 홈 인트로 영상 */
    view.innerHTML='<div class="hero"><video autoplay muted loop playsinline preload="auto" poster="'+HERO+'" src="intro.mp4" aria-label="대표 장면"></video></div>';
  }else if(cine&&b===undefined){
    view.innerHTML=DATA[a].map(function(f,i){return'<a class="bar" href="#/'+a+'/'+i+'" style="--bg-img:'+(f.th||f.stills[0])+(f.pos?';background-position:'+f.pos:'')+'"><span>'+f.t+'<small>'+f.y+'</small></span></a>'}).join('');
  }else if(cine){
    var f=DATA[a][+b];if(!f){location.hash='#/'+a;return}
    cur={f:f,i:0};
    view.innerHTML=playerHTML(f)+'<div class="stage" id="stage" style="'+arStyle(f)+'" role="img" aria-label="'+f.t+' 스틸컷"><button class="prev" aria-label="이전">←</button><button class="next" aria-label="다음">→</button><span class="count" id="count"></span></div>'+
    '<div style="'+wStyle(f)+'"><dl class="cred"><dt>Director</dt><dd>'+f.dir+'</dd><dt>DP</dt><dd>'+f.dop+'</dd></dl>'+(f.note?'<div class="fest">'+f.note+'</div>':'')+'</div>';
    view.querySelector('.prev').onclick=function(){go(-1)};view.querySelector('.next').onclick=function(){go(1)};go(0);wirePlayer(f);
  }else if(a==='photo'){
    if(b===undefined){
      view.innerHTML='<div class="photos">'+PHOTO_DATA.map(function(s,i){return'<a class="tile" href="#/photo/'+i+'" style="background-image:url('+(s.th||s.photos[0])+')'+(s.tpos?';background-position:'+s.tpos:'')+'"><span>'+s.t+'</span></a>'}).join('')+'</div>';
    }else{
      var s=PHOTO_DATA[+b];if(!s){location.hash='#/photo';return}
      view.innerHTML='<article class="ps"><h1 class="ps-title">'+s.t+'</h1>'+s.rows.map(function(r){
        var cls=r.length>1?'pair':(typeof r[0]==='object'?r[0].w:'full');
        return'<div class="ps-row '+cls+'">'+r.map(function(x){var i=typeof x==='object'?x.i:x;return'<figure><img src="'+s.photos[i]+'" alt="'+s.t+' '+(i+1)+'" loading="lazy" decoding="async"></figure>'}).join('')+'</div>'}).join('')+'</article>';
    }
  }else if(a==='info'){
    view.innerHTML='<div class="text info-page">'+(INFO.photo?'<img class="portrait" src="'+esc(INFO.photo)+'" alt="BahkSeHun" onerror="this.remove()">':'')+'<p class="role">'+esc(INFO.role)+'</p><p class="contact">'+(INFO.email?'<a href="mailto:'+esc(INFO.email)+'">'+esc(INFO.email)+'</a><br>':'')+(INFO.instagram?'<a href="https://www.instagram.com/'+esc(INFO.instagram)+'/" target="_blank" rel="noopener">@'+esc(INFO.instagram)+'</a>':'')+'</p></div>';
  }
}
var first=true,tm;
function show(){
  clearTimeout(tm);
  if(first){first=false;render();view.style.opacity=0;requestAnimationFrame(function(){requestAnimationFrame(function(){view.style.opacity=1})});return}
  view.style.opacity=0;
  tm=setTimeout(function(){render();requestAnimationFrame(function(){requestAnimationFrame(function(){view.style.opacity=1})})},450);
}
function wStyle(f){var a=f.ar||'16/9',p=a.split('/'),r=p[0]/p[1];return'width:min(100%,calc(76vh*'+r.toFixed(4)+'));margin:0 auto'}
function arStyle(f){var a=f.ar||'16/9',p=a.split('/'),r=p[0]/p[1];return'aspect-ratio:'+a+';width:min(100%,calc(76vh*'+r.toFixed(4)+'));margin:0 auto'}
function playerHTML(f){if(!f.yt)return'';return'<div class="player" id="player" style="background-image:'+f.stills[0]+'"><button class="pbtn" aria-label="영상 재생"><i></i></button></div><div class="ytlink"><a href="https://www.youtube.com/watch?v='+f.yt+'" target="_blank" rel="noopener">YouTube에서 보기 ↗</a></div>'}
function wirePlayer(f){var b=view.querySelector('.pbtn');if(!b)return;b.onclick=function(){var p=document.getElementById('player');p.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+f.yt+'?autoplay=1&rel=0&modestbranding=1" title="영상" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';p.style.backgroundImage='none'}}
function go(d){
  if(!cur)return;var n=cur.f.stills.length;cur.i=(cur.i+d+n)%n;
  var st=document.getElementById('stage'),src=cur.f.stills[cur.i],old=st.querySelectorAll('.l');
  var l=document.createElement('div');l.className='l';
  l.style.backgroundImage=(src.indexOf('url(')===0||src.indexOf('linear')===0)?src:'url('+src+')';
  l.style.backgroundSize=cur.f.fit||'cover';l.style.backgroundRepeat='no-repeat';l.style.backgroundPosition='center';l.style.opacity=d===0?1:0;st.appendChild(l);l.offsetWidth;l.style.opacity=1;
  old.forEach(function(x){setTimeout(function(){x.remove()},d===0?0:750)});
  document.getElementById('count').textContent=(cur.i+1)+' / '+n;
}
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
window.addEventListener('hashchange',show);show();
</script>
</body>
</html>
